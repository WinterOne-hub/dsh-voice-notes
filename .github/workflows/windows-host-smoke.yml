name: Windows Desktop meeting smoke test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          architecture: x64
      - name: Install signed DeepSeek Harness
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'dsh-windows-x64.exe'
          $desktop = Join-Path $env:RUNNER_TEMP 'voice-notes-harness'
          curl.exe --fail --silent --show-error --location --connect-timeout 15 --max-time 150 --retry 2 'https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe' -o $installer
          if ($LASTEXITCODE -ne 0) { throw 'Official installer download failed' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid') { throw "Official installer signature: $($signature.Status)" }
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$desktop") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Official installer exited $($install.ExitCode)" }
          if (!(Test-Path -LiteralPath (Join-Path $desktop 'DeepSeek Harness.exe'))) { throw 'Installed desktop executable missing' }
          echo "VOICE_NOTES_TEST_DESKTOP=$desktop" >> $env:GITHUB_ENV
      - name: Download and verify the public speaker fixture
        shell: pwsh
        run: |
          $wave = Join-Path $env:RUNNER_TEMP 'four-speakers.wav'
          curl.exe --fail --silent --show-error --location --connect-timeout 15 --max-time 100 --retry 2 'https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/0-four-speakers-zh.wav' -o $wave
          if ($LASTEXITCODE -ne 0) { throw 'Fixture download failed' }
          if ((Get-FileHash -Algorithm SHA256 $wave).Hash.ToLowerInvariant() -ne 'bedf036caed208386c67b4ef4b11f83d74dd0d420b102163a1c33cd09cde7010') { throw 'Fixture checksum mismatch' }
          echo "VOICE_NOTES_TEST_WAV=$wave" >> $env:GITHUB_ENV
      - name: Build native audio component
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" && node scripts/build-system-audio.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
      - name: Test the plugin and run the meeting smoke test
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Plugin tests failed' }
          npm pack --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
          node scripts/meeting-host-smoke.mjs "dsh-voice-notes-$((Get-Content package.json | ConvertFrom-Json).version).tgz" $env:VOICE_NOTES_TEST_WAV
