name: Windows x64 tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          architecture: x64
      - name: Build native capture component
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" && node scripts/build-system-audio.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          $native = Join-Path $PWD 'native/bin/win32-x64/system-audio.exe'
          & $native --probe
          $pcm = Join-Path $env:RUNNER_TEMP 'native-test.pcm'
          $process = Start-Process -FilePath $native -ArgumentList '--self-test' -RedirectStandardOutput $pcm -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Get-Item $pcm).Length -ne 96000) { throw 'Native self-test failed' }
      - run: npm test
      - run: npm pack --ignore-scripts --dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: system-audio-windows-x64
          path: |
            native/bin/win32-x64/system-audio.exe
            native/bin/win32-x64.json
            native/bin/win32-x64/voice-captions.exe
            native/bin/win32-x64-captions.json
          if-no-files-found: error
          retention-days: 7
